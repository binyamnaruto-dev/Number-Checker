<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Checker</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="Head-cont">
        <div class="Head-Right">
            <p>Number Checker validate your number, built by Binyam Naruto.</p>
        </div>
        <div class="Head-Left">
            <img src="../asset/img/num chakl1.png" alt="">
        </div>
    </div>
<!-- Body part -->
    
<div class="Body-cont">
    <div class="all">
        <div class="display-div">
            <div class="Search-div">
                <input class="Search-bar" type="number" placeholder="Enter any number...">
            </div>

            <div class="Button">
                <button class="Search-btn">Check</button>
                <button class="Reset-btn">Reset</button>
            </div>
        </div>
    </div>

    <div class="Info-div">
        <p class="infoP">Positive:</p>
        <p class="infoN">Negative:</p>
        <p class="infoZ">Zero:</p>
        <p class="infoE">Even:</p>
        <p class="infoO">Odd:</p>
    </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
